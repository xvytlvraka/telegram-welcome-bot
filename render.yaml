services:
  - type: web
    name: telegram-auto-admin-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: LINKS_CHANNEL
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: DATA_FILE
        value: data.json
